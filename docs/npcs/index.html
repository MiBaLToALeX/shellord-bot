<html lang="es"><head><meta charset="UTF-8"><title>NPCs Editor</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;font-size:13px}header{background:#16213e;padding:11px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:100;flex-wrap:wrap}header h1{font-size:16px;color:#4ae8c8;white-space:nowrap}.btn{padding:6px 13px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}.btn:hover{opacity:.8}.btn-primary{background:#0f3460;color:#fff}.btn-success{background:#27ae60;color:#fff}.btn-danger{background:#c0392b;color:#fff}.btn-warn{background:#e67e22;color:#fff}.btn-sm{padding:3px 8px;font-size:11px}#load-file{display:none}.lbl-btn{padding:6px 13px;border-radius:5px;background:#533483;color:#fff;font-size:12px;font-weight:600;cursor:pointer}.lbl-btn:hover{opacity:.8}#app{display:flex;height:calc(100vh - 48px);overflow:hidden}#sidebar{width:270px;min-width:210px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;flex-shrink:0}#sidebar-top{padding:8px 10px;border-bottom:1px solid #0f3460}#search{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;width:100%;font-size:12px}#search:focus{outline:0;border-color:#4ae8c8}#npc-list{flex:1;overflow-y:auto}.npc-row{padding:7px 12px;cursor:pointer;border-left:3px solid transparent;display:flex;flex-direction:column;gap:2px}.npc-row:hover{background:#0f3460}.npc-row.active{border-left-color:#4ae8c8;background:#0f3460}.npc-name{font-size:12px;display:flex;align-items:center;gap:5px}.npc-id{font-size:10px;color:#888;font-family:monospace}.trade-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;background:#1a3a1a;color:#90ee90;white-space:nowrap}.trade-badge.buy{background:#3a2a1a;color:#ffcf90}.sidebar-foot{padding:8px 10px;border-top:1px solid #0f3460}#editor{flex:1;overflow-y:auto;padding:20px}.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:15px}.card{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:18px;max-width:820px}.card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.card-hdr h2{font-size:17px;color:#4ae8c8;font-family:monospace}.sec{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between}.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}.fld{display:flex;flex-direction:column;gap:3px}.fld label{font-size:11px;color:#888}.fld input,.fld textarea{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;font-size:13px;font-family:inherit}.fld input:focus,.fld textarea:focus{outline:0;border-color:#4ae8c8}.fld input[type=text]{width:230px}.fld input.w70{width:72px}.fld textarea{width:100%;min-width:560px;height:70px;resize:vertical}.hint{font-size:10px;color:#555;margin-top:2px;line-height:1.5}table.trade{width:100%;max-width:520px;border-collapse:collapse;margin-bottom:6px}table.trade th{font-size:10px;color:#888;text-align:left;padding:3px 6px;text-transform:uppercase}table.trade td{padding:2px 6px}table.trade input{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:4px 6px;border-radius:4px;font-size:12px}table.trade input.id{width:200px}table.trade input.pr{width:100px}table.trade input:focus{outline:0;border-color:#4ae8c8}.empty-trade{font-size:11px;color:#555;padding:4px 0 8px}#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}#modal-overlay.open{display:flex}#modal{background:#16213e;border:1px solid #0f3460;border-radius:10px;width:720px;max-height:82vh;display:flex;flex-direction:column}#modal-head{padding:12px 16px;border-bottom:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between}#modal-head h3{color:#4ae8c8}#modal-body{flex:1;overflow:auto;padding:14px}#modal-body textarea{width:100%;height:420px;background:#0d1b2a;color:#7ec8e3;font-family:monospace;font-size:12px;border:1px solid #0f3460;border-radius:5px;padding:10px;resize:vertical}#modal-foot{padding:10px 16px;border-top:1px solid #0f3460;display:flex;gap:8px;justify-content:flex-end}#status{font-size:11px;color:#888;margin-left:4px}</style></head><body><header><a href="../" title="Volver a las herramientas" style="flex:none;padding:5px 10px;border-radius:5px;background:#12152a;border:1px solid #533483;color:#e8c84a;font:600 12px/1.4 ui-monospace,Consolas,monospace;text-decoration:none;white-space:nowrap">&#8592; Herramientas</a><h1>🤖 NPCs Editor</h1><label class="lbl-btn" for="load-file">📂 Abrir JSON</label> <input type="file" id="load-file" accept=".json"> <button type="button" style="padding:6px 13px;border-radius:5px;background:#1a5276;color:#fff;font-size:12px;font-weight:600;cursor:pointer;border:none" onclick='cargarDesdeRepo("npcs.json")' title="Cargar desde github.com/MiBaLToALeX/shellord-bot">🌐 Cargar del repo</button> <button class="btn btn-success" onclick="openModal()">💾 Exportar</button> <button class="btn btn-warn" onclick="downloadJSON()">⬇️ Descargar</button> <span id="status"></span></header><div id="app"><div id="sidebar"><div id="sidebar-top"><input id="search" placeholder="Buscar por id o nombre…" oninput="renderList()"></div><div id="npc-list"></div><div class="sidebar-foot"><button class="btn btn-success" style="width:100%" onclick="addNpc()">+ Nuevo NPC</button></div></div><div id="editor"><div class="empty-state">Abre un npcs.json o crea un NPC para empezar</div></div></div><div id="modal-overlay"><div id="modal"><div id="modal-head"><h3>JSON exportado</h3><button class="btn btn-sm btn-danger" onclick="closeModal()">X</button></div><div id="modal-body"><textarea id="json-out" readonly="readonly"></textarea></div><div id="modal-foot"><button class="btn btn-primary" onclick="copyJSON()">Copiar</button> <button class="btn btn-success" onclick="downloadJSON()">Descargar</button> <button class="btn btn-danger btn-sm" onclick="closeModal()">Cerrar</button></div></div></div><script>let data=[],activeIdx=-1;function esc(e){return String(e).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function nv(e){return null!=e?e:""}function renderList(){const e=document.getElementById("search").value.toLowerCase(),t=document.getElementById("npc-list");t.innerHTML="",data.forEach((a,n)=>{const d=(a.id+" "+(a.nombre||"")).toLowerCase();if(e&&!d.includes(e))return;const i=document.createElement("div");i.className="npc-row"+(n===activeIdx?" active":"");const s=(a.vende||[]).length,l=(a.compra||[]).length;i.innerHTML='<div class="npc-name">'+esc(a.emoji||"🤖")+" "+esc(a.nombre||a.id)+'</div><div class="npc-id">'+esc(a.id)+(s?' <span class="trade-badge">🛒 '+s+"</span>":"")+(l?' <span class="trade-badge buy">💰 '+l+"</span>":"")+"</div>",i.onclick=()=>{activeIdx=n,renderList(),renderEditor()},t.appendChild(i)})}function renderEditor(){const e=document.getElementById("editor");if(activeIdx<0||!data[activeIdx])return void(e.innerHTML='<div class="empty-state">Selecciona un NPC</div>');const t=data[activeIdx],a=activeIdx;let n='<div class="card">';n+='<div class="card-hdr"><h2>'+esc(t.id)+'</h2><button class="btn btn-danger btn-sm" onclick="deleteNpc('+a+')">Eliminar</button></div>',n+='<div class="sec">Identidad</div>',n+='<div class="row">'+fld('id <span style="color:#4ae8c8">(usado en el mapa -5)</span>','<input type="text" value="'+esc(t.id)+'" onchange="set('+a+",'id',this.value);renderList()\">")+fld("nombre",'<input type="text" style="width:280px" value="'+esc(t.nombre||"")+'" onchange="set('+a+",'nombre',this.value);renderList()\">")+fld("emoji (minimapa)",'<input type="text" class="w70" value="'+esc(t.emoji||"")+'" placeholder="🤖" onchange="setNull('+a+",'emoji',this.value);renderList()\">")+"</div>",n+='<div class="hint">El <b>id</b> debe coincidir con el que pongas en la casilla del editor de mapas (marcador -5).</div>',n+='<div class="sec">Aspecto (sticker)</div>',n+='<div class="row">'+fld('vol <span style="color:#666">(pack de stickers)</span>','<input type="number" class="w70" min="1" value="'+nv(t.vol)+'" placeholder="-" onchange="setNum('+a+",'vol',this.value)\">")+fld('indice <span style="color:#666">(dentro del pack)</span>','<input type="number" class="w70" min="0" value="'+nv(t.indice)+'" placeholder="-" onchange="setNum('+a+",'indice',this.value)\">")+fld('imagen_id <span style="color:#666">(file_id de Telegram)</span>','<input type="text" style="width:300px" value="'+esc(t.imagen_id||"")+'" placeholder="alternativa a vol/indice" onchange="setNull('+a+",'imagen_id',this.value)\">")+"</div>",n+='<div class="hint">Usa <b>vol + indice</b> (como los enemigos) o un <b>imagen_id</b> directo de Telegram. Si defines imagen_id, tiene prioridad.</div>',n+='<div class="sec">Diálogo</div>',n+='<div class="row" style="align-items:stretch"><div class="fld" style="flex:1"><label>dialogo (al acercarse ≤1 casilla)</label><textarea onchange="setNull('+a+',\'dialogo\',this.value)" placeholder="Saludos, viajero...">'+esc(t.dialogo||"")+"</textarea></div></div>",n+='<div class="sec">🛒 Vende <button class="btn btn-success btn-sm" onclick="addItem('+a+",'vende')\">+ objeto</button></div>",n+=tradeTable(a,"vende",t.vende||[],"precio de venta"),n+='<div class="sec">💰 Compra <button class="btn btn-success btn-sm" onclick="addItem('+a+",'compra')\">+ objeto</button></div>",n+=tradeTable(a,"compra",t.compra||[],"créditos que paga"),n+="</div>",e.innerHTML=n}function tradeTable(e,t,a,n){if(!a.length)return'<div class="empty-trade">— sin objetos —</div>';let d='<table class="trade"><thead><tr><th>id objeto</th><th>'+n+"</th><th></th></tr></thead><tbody>";return a.forEach((a,n)=>{d+='<tr><td><input class="id" type="text" value="'+esc(a.id||"")+'" onchange="setItem('+e+",'"+t+"',"+n+',\'id\',this.value)"></td><td><input class="pr" type="number" min="0" value="'+nv(a.precio)+'" onchange="setItemNum('+e+",'"+t+"',"+n+',\'precio\',this.value)"></td><td><button class="btn btn-danger btn-sm" onclick="delItem('+e+",'"+t+"',"+n+')">X</button></td></tr>'}),d+="</tbody></table>",d}function fld(e,t){return'<div class="fld"><label>'+e+"</label>"+t+"</div>"}function set(e,t,a){data[e][t]=a}function setNull(e,t,a){""===a||null==a?delete data[e][t]:data[e][t]=a}function setNum(e,t,a){""===a||null==a?delete data[e][t]:data[e][t]=Number(a)}function ensureList(e,t){return Array.isArray(data[e][t])||(data[e][t]=[]),data[e][t]}function addItem(e,t){ensureList(e,t).push({id:"",precio:0}),renderEditor(),renderList()}function delItem(e,t,a){data[e][t].splice(a,1),data[e][t].length||delete data[e][t],renderEditor(),renderList()}function setItem(e,t,a,n,d){data[e][t][a][n]=d}function setItemNum(e,t,a,n,d){data[e][t][a][n]=Number(d)||0}function addNpc(){const e=prompt("ID del nuevo NPC (ej: mercader_errante):");e&&e.trim()&&(data.find(t=>t.id===e.trim())?alert("Ya existe un NPC con ese ID"):(data.push({id:e.trim(),nombre:"",emoji:"🤖",dialogo:"",vende:[],compra:[]}),activeIdx=data.length-1,renderList(),renderEditor()))}function deleteNpc(e){confirm('Eliminar "'+data[e].id+'"?')&&(data.splice(e,1),activeIdx=Math.min(activeIdx,data.length-1),renderList(),renderEditor())}function buildJSON(){return JSON.stringify(data,null,2)}function openModal(){document.getElementById("json-out").value=buildJSON(),document.getElementById("modal-overlay").classList.add("open")}function closeModal(){document.getElementById("modal-overlay").classList.remove("open")}function copyJSON(){document.getElementById("json-out").select(),document.execCommand("copy"),setStatus("Copiado")}function downloadJSON(){const e=new Blob([buildJSON()],{type:"application/json"}),t=document.createElement("a");t.href=URL.createObjectURL(e),t.download="npcs.json",t.click(),URL.revokeObjectURL(t.href),setStatus("Descargando...")}function setStatus(e){const t=document.getElementById("status");t.textContent=e,setTimeout(()=>{t.textContent===e&&(t.textContent="")},3e3)}document.getElementById("load-file").addEventListener("change",e=>{const t=e.target.files[0];if(!t)return;const a=new FileReader;a.onload=e=>{try{if(data=JSON.parse(e.target.result),!Array.isArray(data))throw new Error("El JSON debe ser un array de NPCs");activeIdx=data.length>0?0:-1,renderList(),renderEditor(),setStatus("Cargado: "+t.name+" ("+data.length+" NPCs)")}catch(e){alert("Error JSON: "+e.message)}},a.readAsText(t),e.target.value=""})</script><script>const REPO_RAW="https://raw.githubusercontent.com/MiBaLToALeX/shellord-bot/main/";async function cargarDesdeRepo(e,t){try{const o=await fetch(REPO_RAW+e,{cache:"no-store"});if(!o.ok)throw new Error(404===o.status?"no existe en el repositorio":"HTTP "+o.status);const s=await o.text(),a=new DataTransfer;a.items.add(new File([s],e.split("/").pop(),{type:"application/json"}));const n=document.getElementById(t||"load-file");n.files=a.files,n.dispatchEvent(new Event("change",{bubbles:!0}))}catch(t){alert("No se pudo cargar "+e+" del repositorio: "+t.message)}}</script></body></html>
