<html lang="es"><head><meta charset="UTF-8"><title>Spawn Table Editor</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;font-size:14px}header{background:#16213e;padding:14px 20px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:100}header h1{font-size:18px;color:#e94560}.btn{padding:7px 14px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s}.btn:hover{opacity:.85}.btn-primary{background:#0f3460;color:#fff}.btn-success{background:#27ae60;color:#fff}.btn-danger{background:#c0392b;color:#fff}.btn-warn{background:#e67e22;color:#fff}.btn-sm{padding:4px 9px;font-size:12px}#load-file{display:none}.label-btn{padding:7px 14px;border-radius:5px;background:#533483;color:#fff;font-size:13px;font-weight:600;cursor:pointer}.label-btn:hover{opacity:.85}#main{display:flex;height:calc(100vh - 53px);overflow:hidden}#sidebar{width:220px;min-width:170px;background:#16213e;border-right:1px solid #0f3460;overflow-y:auto;flex-shrink:0}#sidebar .maz-item{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center}#sidebar .maz-item:hover{background:#0f3460}#sidebar .maz-item.active{border-left-color:#e94560;background:#0f3460;color:#fff}#sidebar .maz-item .maz-name{font-weight:600}#sidebar .maz-item .maz-count{font-size:11px;color:#888}#sidebar .add-maz{padding:10px 14px;color:#27ae60;cursor:pointer;font-size:13px;border-top:1px solid #0f3460}#sidebar .add-maz:hover{background:#0f3460}#editor{flex:1;overflow-y:auto;padding:20px}.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:16px}.maz-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.maz-header h2{font-size:20px;color:#e94560}.field-group{display:flex;align-items:center;gap:8px}.field-group label{color:#aaa;font-size:12px}.field-group input[type=number],.field-group input[type=text]{background:#0f3460;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;width:80px}.entries{display:flex;flex-direction:column;gap:12px}.entry-card{background:#16213e;border:1px solid #0f3460;border-radius:8px;overflow:hidden}.entry-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0d1b2a;flex-wrap:wrap}.entry-head .pct-bar-wrap{flex:1;min-width:120px}.pct-bar-bg{background:#0f3460;border-radius:3px;height:8px;overflow:hidden}.pct-bar-fill{background:#e94560;height:8px;border-radius:3px;transition:width .2s}.pct-label{font-size:11px;color:#e94560;margin-top:2px}.entry-head input[type=number]{background:#1a2a4a;border:1px solid #1a5276;color:#fff;padding:4px 7px;border-radius:4px;width:90px}.entry-head input[type=text]{background:#1a2a4a;border:1px solid #1a5276;color:#ccc;padding:4px 7px;border-radius:4px;width:180px}.entry-body{padding:10px 14px}.rangos-table{width:100%;border-collapse:collapse;margin-top:6px}.rangos-table th{text-align:left;color:#888;font-size:11px;padding:3px 6px}.rangos-table td{padding:4px 6px;vertical-align:middle}.rangos-table tr:hover td{background:rgba(255,255,255,.03)}.rango-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;background:#533483;color:#fff;min-width:22px;text-align:center}.rangos-table input[type=number]{background:#1a2a4a;border:1px solid #1a5276;color:#fff;padding:3px 6px;border-radius:4px;width:70px}.rangos-table input[type=text]{background:#1a2a4a;border:1px solid #1a5276;color:#ccc;padding:3px 6px;border-radius:4px;width:65px}.rangos-table select{background:#1a2a4a;border:1px solid #1a5276;color:#fff;padding:3px 5px;border-radius:4px}.rangos-table .cb{width:16px;height:16px;cursor:pointer}.add-rango{color:#27ae60;font-size:12px;cursor:pointer;margin-top:4px;display:inline-block}.add-rango:hover{text-decoration:underline}.section-label{font-size:11px;color:#888;margin-bottom:4px}.no-rangos{font-size:12px;color:#555}.warn-overlap{background:#4a1a00;border:1px solid #e67e22;color:#e67e22;padding:6px 12px;border-radius:5px;margin-bottom:10px;font-size:12px}#coverage-wrap{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:12px 16px;margin-bottom:16px}#coverage-wrap h3{font-size:13px;color:#aaa;margin-bottom:8px}.cov-bar-bg{background:#0f3460;border-radius:4px;height:12px;overflow:hidden;position:relative}.cov-bar-fill{height:12px;border-radius:4px;background:#27ae60;transition:width .3s}.cov-bar-fill.over{background:#e74c3c}.cov-text{margin-top:5px;font-size:12px;color:#aaa;display:flex;justify-content:space-between}#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}#modal-overlay.open{display:flex}#modal{background:#16213e;border:1px solid #0f3460;border-radius:10px;width:700px;max-height:80vh;display:flex;flex-direction:column}#modal-head{padding:14px 18px;border-bottom:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between}#modal-head h3{color:#e94560}#modal-body{flex:1;overflow:auto;padding:14px}#modal-body textarea{width:100%;height:400px;background:#0d1b2a;color:#7ec8e3;font-family:monospace;font-size:13px;border:1px solid #0f3460;border-radius:5px;padding:10px;resize:vertical}#modal-foot{padding:12px 18px;border-top:1px solid #0f3460;display:flex;gap:10px;justify-content:flex-end}.danger-zone{margin-top:18px;padding-top:12px;border-top:1px solid #3a1111}</style></head><body><header><a href="../" title="Volver a las herramientas" style="flex:none;padding:5px 10px;border-radius:5px;background:#12152a;border:1px solid #533483;color:#e8c84a;font:600 12px/1.4 ui-monospace,Consolas,monospace;text-decoration:none;white-space:nowrap">&#8592; Herramientas</a><h1>⚔️ Spawn Table Editor</h1><label class="label-btn" for="load-file">📂 Abrir JSON</label> <input type="file" id="load-file" accept=".json"> <button type="button" style="padding:6px 13px;border-radius:5px;background:#1a5276;color:#fff;font-size:12px;font-weight:600;cursor:pointer;border:none" onclick='cargarDesdeRepo("spawn_table.json")' title="Cargar desde github.com/MiBaLToALeX/shellord-bot">🌐 Cargar del repo</button> <button class="btn btn-success" onclick="openSaveModal()">💾 Exportar JSON</button> <button class="btn btn-warn" onclick="downloadJSON()">⬇️ Descargar</button> <span id="status-msg" style="font-size:12px;color:#888;margin-left:8px"></span></header><div id="main"><div id="sidebar"><div id="maz-list"></div><div class="add-maz" onclick="addMazmorra()">+ Nueva mazmorra</div></div><div id="editor"><div class="empty-state">Abre un archivo spawn_table.json para empezar</div></div></div><div id="modal-overlay"><div id="modal"><div id="modal-head"><h3>JSON exportado</h3><button class="btn btn-sm btn-danger" onclick="closeModal()">✕</button></div><div id="modal-body"><textarea id="json-out" readonly="readonly"></textarea></div><div id="modal-foot"><button class="btn btn-primary" onclick="copyJSON()">📋 Copiar</button> <button class="btn btn-success" onclick="downloadJSON()">⬇️ Descargar archivo</button> <button class="btn btn-danger btn-sm" onclick="closeModal()">Cerrar</button></div></div></div><script>let data=[],activeMazIdx=null;const RANGOS_ORDER=["E","D","C","B","A","S"];function renderSidebar(){const e=document.getElementById("maz-list");e.innerHTML="",data.forEach((n,a)=>{const t=document.createElement("div");t.className="maz-item"+(a===activeMazIdx?" active":""),t.innerHTML=`<span class="maz-name">${n.mazmorra}</span><span class="maz-count">${n.entradas.length}</span>`,t.onclick=()=>selectMaz(a),e.appendChild(t)})}function selectMaz(e){activeMazIdx=e,renderSidebar(),renderEditor()}function renderEditor(){const e=document.getElementById("editor");if(null===activeMazIdx)return void(e.innerHTML='<div class="empty-state">Selecciona una mazmorra</div>');const n=data[activeMazIdx],a=getOverlapWarnings(n.entradas),t=getCoverage(n.entradas);let d=`\n  <div class="maz-header">\n    <h2>🗺️ ${n.mazmorra}</h2>\n    <div class="field-group">\n      <label>ID mazmorra:</label>\n      <input type="text" value="${esc(n.mazmorra)}" onchange="maz_setField(${activeMazIdx},'mazmorra',this.value)">\n    </div>\n    <div class="field-group">\n      <label>Max enemigos:</label>\n      <input type="number" min="1" max="20" value="${n.max_enemigos||1}" onchange="maz_setField(${activeMazIdx},'max_enemigos',+this.value)">\n    </div>\n    <button class="btn btn-sm btn-danger" onclick="deleteMazmorra(${activeMazIdx})">🗑 Eliminar mazmorra</button>\n  </div>\n\n  <div id="coverage-wrap">\n    <h3>Cobertura del rango 1–10000</h3>\n    ${renderCoverageBar(t)}\n  </div>\n  `;a.length&&a.forEach(e=>{d+=`<div class="warn-overlap">⚠️ ${e}</div>`}),d+='<div class="entries" id="entries-list">',n.entradas.forEach((e,a)=>{d+=renderEntryCard(activeMazIdx,a,e,n.entradas.length)}),d+=`</div>\n  <div style="margin-top:14px;">\n    <button class="btn btn-primary" onclick="addEntry(${activeMazIdx})">+ Añadir entrada</button>\n  </div>\n  <div class="danger-zone">\n    <button class="btn btn-sm btn-danger" onclick="deleteMazmorra(${activeMazIdx})">🗑 Eliminar esta mazmorra</button>\n  </div>\n  `,e.innerHTML=d}function renderCoverageBar(e){const n=Math.min(e/1e4*100,100).toFixed(1),a=e>1e4;return`\n    <div class="cov-bar-bg"><div class="cov-bar-fill${a?" over":""}" style="width:${n}%"></div></div>\n    <div class="cov-text"><span>Cobertura: ${e.toLocaleString()} / 10 000 (${n}%)</span><span style="color:${a?"#e74c3c":1e4===e?"#27ae60":"#e67e22"}">${a?"Solapamiento":1e4===e?"Completo":"Incompleto"}</span></div>\n  `}function renderEntryCard(e,n,a,t){const d=a.desde||1,r=a.hasta||1,s=Math.max(0,r-d+1),o=(s/1e4*100).toFixed(2),i=Math.min(100,s/100).toFixed(1);let l="";const c=a.rangos||{},m=Object.keys(c);return 0===m.length?l='<span class="no-rangos">Sin rangos configurados</span>':(l='\n    <table class="rangos-table">\n      <thead><tr>\n        <th>Rango</th><th>Boss</th><th>Vol</th>\n        <th>idx fijo</th><th>idx min</th><th>idx max</th>\n        <th></th>\n      </tr></thead><tbody>',m.forEach(a=>{const t=c[a];l+=renderRangoRow(e,n,a,t)}),l+="</tbody></table>"),`\n  <div class="entry-card" id="entry-${e}-${n}">\n    <div class="entry-head">\n      <div>\n        <div class="section-label">desde</div>\n        <input type="number" min="1" max="10000" value="${d}"\n          onchange="entry_set(${e},${n},'desde',+this.value);refreshAll(${e})">\n      </div>\n      <div>\n        <div class="section-label">hasta</div>\n        <input type="number" min="1" max="10000" value="${r}"\n          onchange="entry_set(${e},${n},'hasta',+this.value);refreshAll(${e})">\n      </div>\n      <div class="pct-bar-wrap">\n        <div class="pct-bar-bg"><div class="pct-bar-fill" style="width:${i}%"></div></div>\n        <div class="pct-label">${o}% · span ${s.toLocaleString()}</div>\n      </div>\n      <div>\n        <div class="section-label">label</div>\n        <input type="text" value="${esc(a.label||"")}" onchange="entry_set(${e},${n},'label',this.value)">\n      </div>\n      <div style="display:flex;gap:6px;align-items:center;">\n        ${n>0?`<button class="btn btn-sm btn-primary" onclick="moveEntry(${e},${n},-1)">▲</button>`:""}\n        ${n<t-1?`<button class="btn btn-sm btn-primary" onclick="moveEntry(${e},${n},1)">▼</button>`:""}\n        <button class="btn btn-sm btn-danger" onclick="deleteEntry(${e},${n})">✕</button>\n      </div>\n    </div>\n    <div class="entry-body">\n      <div class="section-label" style="margin-bottom:6px;">Rangos de spawneo:</div>\n      ${l}\n      <div style="margin-top:8px;">\n        ${RANGOS_ORDER.filter(e=>!c[e]).map(a=>`<button class="btn btn-sm btn-primary" style="margin:2px" onclick="addRango(${e},${n},'${a}')">+ ${a}</button>`).join("")}\n      </div>\n    </div>\n  </div>`}function renderRangoRow(e,n,a,t){return`<tr>\n    <td><span class="rango-badge">${a}</span></td>\n    <td><input class="cb" type="checkbox" ${t.is_boss?"checked":""} title="is_boss"\n      onchange="rango_setBool(${e},${n},'${a}','is_boss',this.checked)"></td>\n    <td><input type="number" min="1" max="10" value="${void 0!==t.vol?t.vol:""}" placeholder="-"\n      onchange="rango_setNum(${e},${n},'${a}','vol',this.value)"></td>\n    <td><input type="number" min="0" max="999" value="${void 0!==t.enemy_index?t.enemy_index:""}" placeholder="-"\n      onchange="rango_setNum(${e},${n},'${a}','enemy_index',this.value)"></td>\n    <td><input type="number" min="0" max="999" value="${void 0!==t.enemy_index_min?t.enemy_index_min:""}" placeholder="-"\n      onchange="rango_setNum(${e},${n},'${a}','enemy_index_min',this.value)"></td>\n    <td><input type="number" min="0" max="999" value="${void 0!==t.enemy_index_max?t.enemy_index_max:""}" placeholder="-"\n      onchange="rango_setNum(${e},${n},'${a}','enemy_index_max',this.value)"></td>\n    <td><button class="btn btn-sm btn-danger" onclick="deleteRango(${e},${n},'${a}')">✕</button></td>\n  </tr>`}function maz_setField(e,n,a){data[e][n]=a,"mazmorra"===n&&renderSidebar()}function entry_set(e,n,a,t){data[e].entradas[n][a]=t}function rango_setBool(e,n,a,t,d){data[e].entradas[n].rangos||(data[e].entradas[n].rangos={}),d?data[e].entradas[n].rangos[a][t]=!0:delete data[e].entradas[n].rangos[a][t]}function rango_setNum(e,n,a,t,d){data[e].entradas[n].rangos||(data[e].entradas[n].rangos={});const r=data[e].entradas[n].rangos[a];""===d||null==d?delete r[t]:r[t]=parseInt(d,10)}function addRango(e,n,a){data[e].entradas[n].rangos||(data[e].entradas[n].rangos={}),data[e].entradas[n].rangos[a]={},renderEditor()}function deleteRango(e,n,a){delete data[e].entradas[n].rangos[a],0===Object.keys(data[e].entradas[n].rangos).length&&delete data[e].entradas[n].rangos,renderEditor()}function addEntry(e){const n=data[e].entradas,a=n.length>0?n[n.length-1].hasta:0;n.push({desde:a+1,hasta:Math.min(a+100,1e4),label:"nueva entrada"}),renderEditor()}function deleteEntry(e,n){data[e].entradas.splice(n,1),renderEditor()}function moveEntry(e,n,a){const t=data[e].entradas,d=n+a;d<0||d>=t.length||([t[n],t[d]]=[t[d],t[n]],renderEditor())}function addMazmorra(){const e=prompt("ID de la nueva mazmorra:");e&&(data.push({mazmorra:e,max_enemigos:1,entradas:[]}),renderSidebar(),selectMaz(data.length-1))}function deleteMazmorra(e){confirm(`¿Eliminar mazmorra "${data[e].mazmorra}"?`)&&(data.splice(e,1),activeMazIdx=data.length>0?Math.min(e,data.length-1):null,renderSidebar(),renderEditor())}function getCoverage(e){let n=new Set;return e.forEach(e=>{for(let a=e.desde;a<=e.hasta;a++)n.add(a)}),n.size}function getOverlapWarnings(e){const n=[];for(let a=0;a<e.length;a++)for(let t=a+1;t<e.length;t++){const d=e[a],r=e[t],s=Math.max(d.desde,r.desde),o=Math.min(d.hasta,r.hasta);s<=o&&n.push(`Solapamiento entre entrada ${a+1} (${d.desde}–${d.hasta}) y entrada ${t+1} (${r.desde}–${r.hasta}): rango ${s}–${o}`)}return n}function refreshAll(e){renderEditor()}function buildJSON(){return JSON.stringify(data,null,2)}function openSaveModal(){document.getElementById("json-out").value=buildJSON(),document.getElementById("modal-overlay").classList.add("open")}function closeModal(){document.getElementById("modal-overlay").classList.remove("open")}function copyJSON(){document.getElementById("json-out").select(),document.execCommand("copy"),setStatus("✅ JSON copiado al portapapeles")}function downloadJSON(){const e=new Blob([buildJSON()],{type:"application/json"}),n=document.createElement("a");n.href=URL.createObjectURL(e),n.download="spawn_table.json",n.click(),URL.revokeObjectURL(n.href),setStatus("⬇️ Descargando spawn_table.json…")}function setStatus(e){const n=document.getElementById("status-msg");n.textContent=e,setTimeout(()=>{n.textContent===e&&(n.textContent="")},3e3)}function esc(e){return String(e).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}document.getElementById("load-file").addEventListener("change",e=>{const n=e.target.files[0];if(!n)return;const a=new FileReader;a.onload=e=>{try{data=JSON.parse(e.target.result),renderSidebar(),data.length>0&&selectMaz(0),setStatus("✅ "+n.name+" cargado")}catch(e){alert("Error al parsear JSON: "+e.message)}},a.readAsText(n),e.target.value=""})</script><script>const REPO_RAW="https://raw.githubusercontent.com/MiBaLToALeX/shellord-bot/main/";async function cargarDesdeRepo(e,t){try{const o=await fetch(REPO_RAW+e,{cache:"no-store"});if(!o.ok)throw new Error(404===o.status?"no existe en el repositorio":"HTTP "+o.status);const s=await o.text(),a=new DataTransfer;a.items.add(new File([s],e.split("/").pop(),{type:"application/json"}));const n=document.getElementById(t||"load-file");n.files=a.files,n.dispatchEvent(new Event("change",{bubbles:!0}))}catch(t){alert("No se pudo cargar "+e+" del repositorio: "+t.message)}}</script></body></html>
