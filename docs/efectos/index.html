<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Efectos Editor</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;font-size:13px}header{background:#16213e;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:100;flex-wrap:wrap}header h1{font-size:16px;color:#e94560;white-space:nowrap}.btn{padding:6px 13px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}.btn:hover{opacity:.8}.btn-primary{background:#0f3460;color:#fff}.btn-success{background:#27ae60;color:#fff}.btn-danger{background:#c0392b;color:#fff}.btn-warn{background:#e67e22;color:#fff}.btn-repo{background:#1a5276;color:#fff}.btn-sm{padding:3px 8px;font-size:11px}#load-file{display:none}.lbl-btn{padding:6px 13px;border-radius:5px;background:#533483;color:#fff;font-size:12px;font-weight:600;cursor:pointer}.lbl-btn:hover{opacity:.8}#app{display:flex;height:calc(100vh - 49px);overflow:hidden}#sidebar{width:230px;min-width:180px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;flex-shrink:0}#lista{flex:1;overflow-y:auto}.item{padding:9px 12px;cursor:pointer;border-left:3px solid transparent;display:flex;flex-direction:column;gap:2px}.item:hover{background:#0f3460}.item.active{border-left-color:#e94560;background:#0f3460}.item-id{font-size:11px;color:#aaa;font-family:monospace}.item-nombre{font-size:13px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-nombre.perjuicio{color:#ff8a8a}.sidebar-foot{padding:10px 12px;border-top:1px solid #0f3460;display:flex;flex-direction:column;gap:6px}#search{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:6px 8px;border-radius:4px;width:100%;font-size:12px}#editor{flex:1;overflow-y:auto;padding:20px}.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:15px;text-align:center;line-height:1.6}.card{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:18px;max-width:900px}.card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.card-header h2{font-size:18px;color:#e94560;font-family:monospace}.section-hdr{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid #0f3460;display:flex;justify-content:space-between;align-items:center}.field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}.field{display:flex;flex-direction:column;gap:3px}.field label{font-size:11px;color:#888}.field input[type=number],.field input[type=text],.field select,.field textarea{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;font-size:13px}.field input[type=text]{width:200px}.field input[type=number]{width:90px}.field textarea{width:460px;max-width:100%;height:55px;resize:vertical;font-family:inherit}.check-row{display:flex;align-items:center;gap:6px;padding:6px 0 2px}.check-row input{width:15px;height:15px;cursor:pointer}.ayuda{font-size:11px;color:#7ec8e3;margin:-4px 0 10px;line-height:1.5}table.comp{width:100%;border-collapse:collapse;margin-bottom:8px}table.comp th{text-align:left;color:#777;font-size:11px;padding:4px 6px}table.comp td{padding:4px 5px;vertical-align:middle}table.comp tr:nth-child(2n) td{background:rgba(255,255,255,.025)}table.comp input,table.comp select{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:4px 7px;border-radius:4px;font-size:13px}table.comp input{width:80px}.resumen{background:#0d1b2a;border:1px solid #533483;border-radius:6px;padding:8px 10px;color:#c4a8ff;font-size:12px;margin-top:6px}#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}#modal-overlay.open{display:flex}#modal{background:#16213e;border:1px solid #0f3460;border-radius:10px;width:700px;max-width:95vw;max-height:82vh;display:flex;flex-direction:column}#modal-head{padding:12px 16px;border-bottom:1px solid #0f3460;display:flex;justify-content:space-between;align-items:center}#modal-head h3{color:#e94560}#modal-body{flex:1;overflow:auto;padding:14px}#modal-body textarea{width:100%;height:420px;background:#0d1b2a;color:#7ec8e3;font-family:monospace;font-size:12px;border:1px solid #0f3460;border-radius:5px;padding:10px;resize:vertical}#modal-foot{padding:10px 16px;border-top:1px solid #0f3460;display:flex;gap:8px;justify-content:flex-end}@media (max-width:700px){#app{flex-direction:column;height:auto}#sidebar{width:100%;max-height:40vh}}</style></head><body><header><a href="../" title="Volver a las herramientas" style="flex:none;padding:5px 10px;border-radius:5px;background:#12152a;border:1px solid #533483;color:#e8c84a;font:600 12px/1.4 ui-monospace,Consolas,monospace;text-decoration:none;white-space:nowrap">&#8592; Herramientas</a><h1>Efectos Editor</h1><label class="lbl-btn" for="load-file">Abrir JSON</label> <input type="file" id="load-file" accept=".json"> <button class="btn btn-repo" onclick='cargarDesdeRepo("efectos.json")' title="Cargar desde github.com/MiBaLToALeX/shellord-bot">🌐 Cargar del repo</button> <button class="btn btn-primary" onclick="usarPorDefecto()" title="Empezar con los efectos que trae el juego">Catálogo por defecto</button> <button class="btn btn-success" onclick="openModal()">Exportar</button> <button class="btn btn-warn" onclick="downloadJSON()">Descargar</button> <span id="status" style="font-size:11px;color:#888;margin-left:6px"></span></header><div id="app"><div id="sidebar"><div style="padding:8px 10px;border-bottom:1px solid #0f3460"><input id="search" placeholder="Buscar..." oninput="renderSidebar()"></div><div id="lista"></div><div class="sidebar-foot"><button class="btn btn-success" onclick="addEfecto()">+ Nuevo efecto</button></div></div><div id="editor"><div class="empty-state">Abre tu efectos.json, cárgalo del repositorio<br>o empieza con el catálogo por defecto.</div></div></div><div id="modal-overlay"><div id="modal"><div id="modal-head"><h3>JSON exportado</h3><button class="btn btn-sm btn-danger" onclick="closeModal()">X</button></div><div id="modal-body"><textarea id="json-out" readonly="readonly"></textarea></div><div id="modal-foot"><button class="btn btn-primary" onclick="copyJSON()">Copiar</button> <button class="btn btn-success" onclick="downloadJSON()">Descargar</button> <button class="btn btn-danger btn-sm" onclick="closeModal()">Cerrar</button></div></div></div><script>const COMPONENTES={atk_pct:"% de daño de sus golpes",atk_fijo:"daño fijo que suma a sus golpes",def_fija:"DEF fija al recibir golpes",def_pct:"% de DEF (factor −1: la pierde)",dano_recibido_pct:"% menos de daño recibido",critico_pct:"% de probabilidad de crítico"},GASTOS={atacar:"en cada golpe que da",recibir:"en cada golpe que recibe"},POR_DEFECTO=[{id:"potencia",nombre:"Potencia",emoji:"💪",gasta:"atacar",turnos:3,componentes:{atk_pct:1},descripcion:"+VALOR% de daño en sus golpes."},{id:"poder",nombre:"Poder",emoji:"⚡",gasta:"atacar",turnos:3,componentes:{atk_fijo:1},descripcion:"+VALOR de daño fijo en sus golpes."},{id:"resistente",nombre:"Resistente",emoji:"🧱",gasta:"recibir",turnos:3,componentes:{def_fija:1},descripcion:"+VALOR de DEF fija al recibir golpes."},{id:"debilidad",nombre:"Debilidad",emoji:"😵",perjuicio:!0,gasta:"atacar",turnos:3,componentes:{def_pct:-1},descripcion:"Pierde VALOR% de su DEF."},{id:"holoescudo",nombre:"Holoescudo",emoji:"🛡️",gasta:"recibir",turnos:2,componentes:{dano_recibido_pct:1},descripcion:"Recibe VALOR% menos de daño."},{id:"critico",nombre:"Crítico",emoji:"🎯",gasta:"atacar",turnos:3,componentes:{critico_pct:1},descripcion:"+VALOR% de probabilidad de crítico."},{id:"turbo",nombre:"Turbo",emoji:"☀️",nativo:!0,descripcion:"+VALOR% de ATK (Impulso de Luz)."},{id:"rabia",nombre:"Rabia",emoji:"🔥",nativo:!0,descripcion:"+VALOR% de ATK."},{id:"coraza",nombre:"Coraza",emoji:"🛡️",nativo:!0,descripcion:"Duplica la DEF plana."},{id:"medicina",nombre:"Medicina",emoji:"💊",nativo:!0,descripcion:"Las curas aumentan un VALOR%."},{id:"alquimista",nombre:"Alquimista",emoji:"🧪",nativo:!0,descripcion:"Las pociones de cura y mejora también afectan a los jugadores a 2 casillas."},{id:"transmutar",nombre:"Transmutar",emoji:"🌈",nativo:!0,descripcion:"Golpea con el elemento que gana al enemigo y se defiende con ventaja."},{id:"repartir",nombre:"Repartir",emoji:"🤝",nativo:!0,descripcion:"El daño que recibe se divide con los jugadores a 2 casillas."},{id:"trampero",nombre:"Trampero",emoji:"🪤",nativo:!0,descripcion:"+VALOR de daño fijo en sus trampas (se gasta al explotar)."},{id:"trampero2",nombre:"Trampero II",emoji:"🪤",nativo:!0,descripcion:"+VALOR% de daño en sus trampas (se gasta al explotar)."}];let data=[],activo=null;function usarPorDefecto(){data.length&&!confirm("¿Sustituir lo que tienes por el catálogo por defecto?")||(data=JSON.parse(JSON.stringify(POR_DEFECTO)),activo=data[0].id,renderSidebar(),renderEditor())}function renderSidebar(){const e=document.getElementById("search").value.toLowerCase();document.getElementById("lista").innerHTML=data.filter(o=>!e||(o.id+" "+(o.nombre||"")).toLowerCase().includes(e)).map(e=>'<div class="item'+(e.id===activo?" active":"")+'" onclick="activo=\''+esc(e.id)+'\';renderSidebar();renderEditor()"><span class="item-id">'+esc(e.id)+'</span><span class="item-nombre'+(e.perjuicio?" perjuicio":"")+'">'+esc((e.emoji?e.emoji+" ":"")+(e.nombre||""))+"</span></div>").join("")}function renderEditor(){const e=data.findIndex(e=>e.id===activo),o=document.getElementById("editor");if(e<0)return void(o.innerHTML='<div class="empty-state">Elige un efecto o crea uno nuevo.</div>');const t=data[e],a=Object.entries(t.componentes||{});let n='<div class="card"><div class="card-header"><h2>'+esc(t.id)+'</h2><button class="btn btn-danger btn-sm" onclick="delEfecto('+e+')">Eliminar</button></div>';n+='<div class="field-row">'+campo("id",'<input type="text" value="'+esc(t.id)+'" onchange="cambiarId('+e+',this.value)">')+campo("nombre",'<input type="text" value="'+esc(t.nombre||"")+'" onchange="set('+e+",'nombre',this.value);renderSidebar()\">")+campo("emoji",'<input type="text" style="width:70px" value="'+esc(t.emoji||"")+'" onchange="set('+e+",'emoji',this.value);renderSidebar()\">")+campo("turnos por defecto",'<input type="number" min="1" max="254" value="'+(t.turnos||3)+'" onchange="set('+e+",'turnos',Number(this.value))\">")+campo("gasta un turno",'<select onchange="set('+e+",'gasta',this.value)\">"+Object.entries(GASTOS).map(([e,o])=>'<option value="'+e+'"'+((t.gasta||"atacar")===e?" selected":"")+">"+o+"</option>").join("")+"</select>")+"</div>",n+='<div class="check-row"><input type="checkbox" id="perj" '+(t.perjuicio?"checked":"")+' onchange="set('+e+',\'perjuicio\',this.checked);renderSidebar()"><label for="perj">Es un perjuicio para quien lo lleva (sale en rojo)</label></div>',n+='<div class="check-row"><input type="checkbox" id="nat" '+(t.nativo?"checked":"")+' onchange="set('+e+',\'nativo\',this.checked)"><label for="nat" title="Lo que hace ya lo calcula el código del juego con este id (turbo, rabia, coraza...): no lleva componentes ni se gasta solo. Por ahora solo afectan a jugadores.">Nativo: lo que hace lo calcula el juego con este id</label></div>',n+='<div class="field-row">'+campo("descripción (VALOR = el valor con que se aplica)",'<textarea onchange="set('+e+",'descripcion',this.value)\">"+esc(t.descripcion||"")+"</textarea>")+"</div>",n+='<div class="section-hdr"><span>Componentes: lo que hace</span><button class="btn btn-sm btn-primary" onclick="addComp('+e+')">+ Componente</button></div>',n+='<div class="ayuda">Cada componente suma VALOR × factor a quien lleva el efecto (jugador, invocación o enemigo). Factor −1 para restar.</div>',a.length?(n+='<table class="comp"><tr><th>componente</th><th>factor</th><th></th></tr>',a.forEach(([o,t])=>{n+='<tr><td><select onchange="renombrarComp('+e+",'"+o+"',this.value)\">"+Object.entries(COMPONENTES).map(([e,t])=>'<option value="'+e+'"'+(e===o?" selected":"")+">"+e+" — "+t+"</option>").join("")+'</select></td><td><input type="number" value="'+t+'" onchange="setComp('+e+",'"+o+'\',this.value)"></td><td><button class="btn btn-sm btn-danger" onclick="delComp('+e+",'"+o+"')\">X</button></td></tr>"}),n+="</table>"):n+='<div style="color:#666;font-size:12px">Sin componentes: el efecto no hace nada todavía.</div>',n+='<div class="resumen">'+esc(resumen(t))+"</div></div>",o.innerHTML=n}function resumen(e){const o=Object.entries(e.componentes||{}).map(([e,o])=>(o<0?"−":"+")+(1===Math.abs(o)?"":Math.abs(o)+"×")+"VALOR "+(COMPONENTES[e]||e));return e.nativo?(e.perjuicio?"Perjuicio":"Mejora")+" nativa · lo que hace lo calcula el juego con el id «"+e.id+"»"+(e.descripcion?": "+e.descripcion:"."):(e.perjuicio?"Perjuicio":"Mejora")+" · "+(o.join(", ")||"sin efecto")+" · dura "+(e.turnos||3)+" turnos por defecto, gasta "+GASTOS[e.gasta||"atacar"]+"."}function campo(e,o){return'<div class="field"><label>'+e+"</label>"+o+"</div>"}function set(e,o,t){data[e][o]=t,"perjuicio"!==o&&"nativo"!==o||t||delete data[e][o],renderEditor()}function cambiarId(e,o){return o=o.trim(),/^[a-z0-9_]+$/.test(o)?data.some((t,a)=>a!==e&&t.id===o)?(alert("Ya hay un efecto con ese id"),void renderEditor()):(data[e].id=o,activo=o,renderSidebar(),void renderEditor()):(alert("El id solo puede tener minúsculas, números y _"),void renderEditor())}function addEfecto(){const e=(prompt("Id del nuevo efecto (minúsculas, números y _):")||"").trim();e&&(/^[a-z0-9_]+$/.test(e)?data.some(o=>o.id===e)?alert("Ya existe"):(data.push({id:e,nombre:e.charAt(0).toUpperCase()+e.slice(1).replace(/_/g," "),emoji:"",gasta:"atacar",turnos:3,componentes:{},descripcion:""}),activo=e,renderSidebar(),renderEditor()):alert("El id solo puede tener minúsculas, números y _"))}function delEfecto(e){confirm("¿Eliminar el efecto «"+data[e].id+"»? Las habilidades que lo usen dejarán de aplicarlo.")&&(data.splice(e,1),activo=data.length?data[0].id:null,renderSidebar(),renderEditor())}function addComp(e){const o=data[e].componentes||(data[e].componentes={}),t=Object.keys(COMPONENTES).find(e=>!(e in o));t?(o[t]=1,renderEditor()):alert("Ya tiene todos los componentes")}function setComp(e,o,t){data[e].componentes[o]=Number(t)||0,renderEditor()}function delComp(e,o){delete data[e].componentes[o],renderEditor()}function renombrarComp(e,o,t){const a=data[e].componentes;if(t in a&&t!==o)return alert("Ese componente ya está"),void renderEditor();const n=a[o];delete a[o],a[t]=n,renderEditor()}function buildJSON(){return JSON.stringify(data,null,2)+"\n"}function openModal(){document.getElementById("json-out").value=buildJSON(),document.getElementById("modal-overlay").classList.add("open")}function closeModal(){document.getElementById("modal-overlay").classList.remove("open")}function copyJSON(){document.getElementById("json-out").select(),document.execCommand("copy"),setStatus("Copiado")}function downloadJSON(){const e=document.createElement("a");e.href=URL.createObjectURL(new Blob([buildJSON()],{type:"application/json"})),e.download="efectos.json",e.click(),URL.revokeObjectURL(e.href),setStatus("Descargando...")}function setStatus(e){const o=document.getElementById("status");o.textContent=e,setTimeout(()=>{o.textContent===e&&(o.textContent="")},3e3)}function esc(e){return String(e).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}document.getElementById("load-file").addEventListener("change",e=>{const o=e.target.files[0];if(!o)return;const t=new FileReader;t.onload=e=>{try{const o=JSON.parse(e.target.result);if(!Array.isArray(o))throw new Error("debe ser una lista de efectos");data=o,activo=data.length?data[0].id:null,renderSidebar(),renderEditor(),setStatus(data.length+" efectos cargados")}catch(e){alert("JSON no válido: "+e.message)}},t.readAsText(o),e.target.value=""})</script><script>const REPO_RAW="https://raw.githubusercontent.com/MiBaLToALeX/shellord-bot/main/";async function cargarDesdeRepo(e,t){try{const o=await fetch(REPO_RAW+e,{cache:"no-store"});if(!o.ok)throw new Error(404===o.status?"no existe en el repositorio (aún no lo has subido)":"HTTP "+o.status);const s=await o.text(),a=new DataTransfer;a.items.add(new File([s],e.split("/").pop(),{type:"application/json"}));const n=document.getElementById(t||"load-file");n.files=a.files,n.dispatchEvent(new Event("change",{bubbles:!0}))}catch(t){alert("No se pudo cargar "+e+" del repositorio: "+t.message)}}</script></body></html>
