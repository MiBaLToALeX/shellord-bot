",nombre:"Regeneración",emoji:"🔄",nativo:!0,descripcion:"Recupera VALOR de energía cada vez que ataca."},{id:"optimizacion",nombre:"Optimización",emoji:"🔥",nativo:!0,descripcion:"+VALOR% de daño en sus golpes."},{id:"suertudo",nombre:"Suerte",emoji:"🍀",nativo:!0,descripcion:"Más fácil sacar crítico (VALOR)."},{id:"precision",nombre:"Precisión",emoji:"🎯",nativo:!0,descripcion:"Falla un VALOR% menos sus ataques."},{id:"overclock",nombre:"Overclock",emoji:"⚙️",nativo:!0,descripcion:"+VALOR% de ATK (a cambio de defensa)."},{id:"invisibilidad",nombre:"Invisibilidad",emoji:"👻",nativo:!0,descripcion:"Los enemigos fallan un VALOR% de sus ataques contra él."},{id:"invisible_skill",nombre:"Invisible",emoji:"👻",nativo:!0,segundos:30,descripcion:"Los enemigos fallan todos sus ataques contra él."},{id:"energico",nombre:"Enérgico",emoji:"⚡",nativo:!0,descripcion:"Sus habilidades cuestan menos energía (VALOR%)."},{id:"pesado",nombre:"Pesado",emoji:"🪨",nativo:!0,descripcion:"Inmune a empujes y desplazamientos."},{id:"huesped",nombre:"Huésped",emoji:"🦠",nativo:!0,descripcion:"+VALOR de energía máxima y VALOR2% de resistencia."},{id:"curandero",nombre:"Curandero",emoji:"💊",nativo:!0,descripcion:"Sus curas aumentan un VALOR% (se gasta al recibir golpes)."},{id:"reenvio",nombre:"Reenvío",emoji:"🔁",nativo:!0,descripcion:"Devuelve al atacante un VALOR% del daño que recibe."},{id:"vampirismo",nombre:"Vampirismo",emoji:"🧛",nativo:!0,perjuicio:!0,descripcion:"Al golpear pierde un VALOR% del daño que hace, y con eso se curan sus rivales a VALOR2 casillas."},{id:"reductor",nombre:"Reductor",emoji:"🛡️",nativo:!0,descripcion:"Reduce el daño que recibe entre VALOR y VALOR2."},{id:"paroimpar",nombre:"Par o impar",emoji:"🎲",nativo:!0,descripcion:"Sus golpes pares (o impares) hacen más daño."},{id:"libre",nombre:"Escape",emoji:"🏃",nativo:!0,descripcion:"Puede alejarse de un enemigo pegado a él (se pierde al andar)."},{id:"protector",nombre:"Protector",emoji:"🛡️",nativo:!0,segundos:60,descripcion:"+
