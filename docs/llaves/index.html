<html lang="es"><head><meta charset="UTF-8"><title>Llaves Editor</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;font-size:13px}header{background:#16213e;padding:11px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:100;flex-wrap:wrap}header h1{font-size:16px;color:#e94560;white-space:nowrap}.btn{padding:6px 13px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}.btn:hover{opacity:.8}.btn-primary{background:#0f3460;color:#fff}.btn-success{background:#27ae60;color:#fff}.btn-danger{background:#c0392b;color:#fff}.btn-warn{background:#e67e22;color:#fff}.btn-sm{padding:3px 8px;font-size:11px}#load-file{display:none}.lbl-btn{padding:6px 13px;border-radius:5px;background:#533483;color:#fff;font-size:12px;font-weight:600;cursor:pointer}.lbl-btn:hover{opacity:.8}#app{display:flex;height:calc(100vh - 48px);overflow:hidden}#sidebar{width:260px;min-width:200px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;flex-shrink:0}#sidebar-top{padding:8px 10px;border-bottom:1px solid #0f3460}#search{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;width:100%;font-size:12px}#search:focus{outline:0;border-color:#533483}#key-list{flex:1;overflow-y:auto}.key-row{padding:7px 12px;cursor:pointer;border-left:3px solid transparent;display:flex;flex-direction:column;gap:2px}.key-row:hover{background:#0f3460}.key-row.active{border-left-color:#e94560;background:#0f3460}.key-name{font-size:12px;display:flex;align-items:center;gap:5px}.key-id{font-size:10px;color:#888;font-family:monospace}.rng-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;background:#1a3a1a;color:#90ee90;white-space:nowrap}.maz-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;background:#2a1a4a;color:#c4a8ff;white-space:nowrap}.sidebar-foot{padding:8px 10px;border-top:1px solid #0f3460}#editor{flex:1;overflow-y:auto;padding:20px}.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:15px}.card{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:18px;max-width:780px}.card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.card-hdr h2{font-size:17px;color:#e94560;font-family:monospace}.sec{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #0f3460}.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}.fld{display:flex;flex-direction:column;gap:3px}.fld label{font-size:11px;color:#888}.fld input,.fld select{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;font-size:13px}.fld input[type=text]{width:230px}.fld input.w70{width:72px}.fld input.w90{width:92px}.fld select{width:130px}.hint{font-size:10px;color:#555;margin-top:2px}#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}#modal-overlay.open{display:flex}#modal{background:#16213e;border:1px solid #0f3460;border-radius:10px;width:700px;max-height:82vh;display:flex;flex-direction:column}#modal-head{padding:12px 16px;border-bottom:1px solid #0f3460;display:flex;align-items:center;justify-content:space-between}#modal-head h3{color:#e94560}#modal-body{flex:1;overflow:auto;padding:14px}#modal-body textarea{width:100%;height:420px;background:#0d1b2a;color:#7ec8e3;font-family:monospace;font-size:12px;border:1px solid #0f3460;border-radius:5px;padding:10px;resize:vertical}#modal-foot{padding:10px 16px;border-top:1px solid #0f3460;display:flex;gap:8px;justify-content:flex-end}#status{font-size:11px;color:#888;margin-left:4px}</style></head><body><header><a href="../" title="Volver a las herramientas" style="flex:none;padding:5px 10px;border-radius:5px;background:#12152a;border:1px solid #533483;color:#e8c84a;font:600 12px/1.4 ui-monospace,Consolas,monospace;text-decoration:none;white-space:nowrap">&#8592; Herramientas</a><h1>🗝️ Llaves Editor</h1><label class="lbl-btn" for="load-file">📂 Abrir JSON</label> <input type="file" id="load-file" accept=".json"> <button type="button" style="padding:6px 13px;border-radius:5px;background:#1a5276;color:#fff;font-size:12px;font-weight:600;cursor:pointer;border:none" onclick='cargarDesdeRepo("llaves.json")' title="Cargar desde github.com/MiBaLToALeX/shellord-bot">🌐 Cargar del repo</button> <button class="btn btn-success" onclick="openModal()">💾 Exportar</button> <button class="btn btn-warn" onclick="downloadJSON()">⬇️ Descargar</button> <span id="status"></span></header><div id="app"><div id="sidebar"><div id="sidebar-top"><input id="search" placeholder="Buscar por id, nombre o mazmorra…" oninput="renderList()"></div><div id="key-list"></div><div class="sidebar-foot"><button class="btn btn-success" style="width:100%" onclick="addLlave()">+ Nueva llave</button></div></div><div id="editor"><div class="empty-state">Abre un llaves.json para empezar</div></div></div><div id="modal-overlay"><div id="modal"><div id="modal-head"><h3>JSON exportado</h3><button class="btn btn-sm btn-danger" onclick="closeModal()">X</button></div><div id="modal-body"><textarea id="json-out" readonly="readonly"></textarea></div><div id="modal-foot"><button class="btn btn-primary" onclick="copyJSON()">Copiar</button> <button class="btn btn-success" onclick="downloadJSON()">Descargar</button> <button class="btn btn-danger btn-sm" onclick="closeModal()">Cerrar</button></div></div></div><script>let data=[],activeIdx=-1;function esc(e){return String(e).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function nv(e){return null!=e?e:""}function renderList(){const e=document.getElementById("search").value.toLowerCase(),n=document.getElementById("key-list");n.innerHTML="",data.forEach((t,a)=>{const i=(t.id+" "+(t.nombre||"")+" "+(t.mazmorra||"")).toLowerCase();if(e&&!i.includes(e))return;const l=document.createElement("div");l.className="key-row"+(a===activeIdx?" active":""),l.innerHTML='<div class="key-name">'+esc(t.emoji||"🗝")+" "+esc(t.nombre||t.id)+'</div><div class="key-id">'+esc(t.id)+' <span class="maz-badge">'+esc(t.mazmorra||"?")+'</span> <span class="rng-badge">'+esc(t.rango_requerido||"—")+'</span> <span style="color:#666">nv.'+nv(t.nivel_min)+"-"+nv(t.nivel_max)+"</span></div>",l.onclick=()=>{activeIdx=a,renderList(),renderEditor()},n.appendChild(l)})}function renderEditor(){const e=document.getElementById("editor");if(activeIdx<0||!data[activeIdx])return void(e.innerHTML='<div class="empty-state">Selecciona una llave</div>');const n=data[activeIdx],t=activeIdx,a='<select onchange="setNull('+t+",'rango_requerido',this.value)\">"+["","E","D","C","B","A","S","MAX"].map(e=>'<option value="'+e+'"'+((n.rango_requerido||"")===e?" selected":"")+">"+(""===e?"— cualquiera —":e)+"</option>").join("")+"</select>";let i='<div class="card">';i+='<div class="card-hdr"><h2>'+esc(n.id)+'</h2><button class="btn btn-danger btn-sm" onclick="deleteLlave('+t+')">Eliminar</button></div>',i+='<div class="sec">Identidad</div>',i+='<div class="row">'+fld("id (item inventario)",'<input type="text" value="'+esc(n.id)+'" onchange="set('+t+",'id',this.value);renderList()\">")+fld("nombre",'<input type="text" style="width:280px" value="'+esc(n.nombre||"")+'" onchange="set('+t+",'nombre',this.value);renderList()\">")+"</div>",i+='<div class="row">'+fld('mazmorra <span style="color:#c4a8ff">(spawn_table)</span>','<input type="text" class="w90" style="width:140px" value="'+esc(n.mazmorra||"")+'" onchange="set('+t+",'mazmorra',this.value);renderList()\">")+fld("nivel_min",'<input type="number" class="w70" min="1" value="'+nv(n.nivel_min)+'" onchange="setNum('+t+",'nivel_min',this.value)\">")+fld("nivel_max",'<input type="number" class="w70" min="1" value="'+nv(n.nivel_max)+'" onchange="setNum('+t+",'nivel_max',this.value)\">")+fld("rango_requerido",a)+"</div>",i+='<div class="hint">El portal generado sortea su nivel entre nivel_min y nivel_max. La mazmorra debe existir en spawn_table.json (o tener mapa fijo en mazmorras/).</div>',i+='<div class="sec">Sticker de la llave (inventario)</div>',i+='<div class="row">'+fld("emoji",'<input type="text" class="w70" value="'+esc(n.emoji||"")+'" onchange="set('+t+",'emoji',this.value);renderList()\">")+fld("emoji_vol",'<input type="number" class="w70" min="1" value="'+nv(n.emoji_vol)+'" placeholder="1" onchange="setNum('+t+",'emoji_vol',this.value)\">")+fld("emoji_indice",'<input type="number" class="w70" min="0" value="'+nv(n.emoji_indice)+'" placeholder="0" onchange="setNum('+t+",'emoji_indice',this.value)\">")+"</div>",i+='<div class="sec">Sticker del portal generado</div>',i+='<div class="row">'+fld("portal_emoji",'<input type="text" class="w70" value="'+esc(n.portal_emoji||"")+'" placeholder="🌀" onchange="setNull('+t+",'portal_emoji',this.value)\">")+fld("portal_vol",'<input type="number" class="w70" min="1" value="'+nv(n.portal_vol)+'" placeholder="2" onchange="setNum('+t+",'portal_vol',this.value)\">")+fld("portal_indice",'<input type="number" class="w70" min="0" value="'+nv(n.portal_indice)+'" placeholder="0" onchange="setNum('+t+",'portal_indice',this.value)\">")+"</div>",i+='<div class="sec">Sticker de bienvenida (al entrar)</div>',i+='<div class="row">'+fld("bienvenida_emoji",'<input type="text" class="w70" value="'+esc(n.bienvenida_emoji||"")+'" placeholder="-" onchange="setNull('+t+",'bienvenida_emoji',this.value)\">")+fld("bienvenida_vol",'<input type="number" class="w70" min="1" value="'+nv(n.bienvenida_vol)+'" placeholder="1" onchange="setNum('+t+",'bienvenida_vol',this.value)\">")+fld("bienvenida_indice",'<input type="number" class="w70" min="0" value="'+nv(n.bienvenida_indice)+'" placeholder="0" onchange="setNum('+t+",'bienvenida_indice',this.value)\">")+"</div>",i+='<div class="hint">Si bienvenida_emoji está vacío no se envía sticker de bienvenida.</div>',i+="</div>",e.innerHTML=i}function fld(e,n){return'<div class="fld"><label>'+e+"</label>"+n+"</div>"}function set(e,n,t){data[e][n]=t}function setNull(e,n,t){""===t||null==t?(data[e][n]=null,"rango_requerido"!==n&&delete data[e][n]):data[e][n]=t}function setNum(e,n,t){""===t||null==t?delete data[e][n]:data[e][n]=Number(t)}function addLlave(){const e=prompt("ID de la nueva llave (ej: key_nueva):");e&&e.trim()&&(data.find(n=>n.id===e.trim())?alert("Ya existe una llave con ese ID"):(data.push({id:e.trim(),nombre:"",emoji:"🗝",portal_emoji:"🌀",portal_vol:2,portal_indice:0,mazmorra:"",nivel_min:1,nivel_max:10,rango_requerido:null}),activeIdx=data.length-1,renderList(),renderEditor()))}function deleteLlave(e){confirm('Eliminar "'+data[e].id+'"?')&&(data.splice(e,1),activeIdx=Math.min(activeIdx,data.length-1),renderList(),renderEditor())}function buildJSON(){return JSON.stringify(data,null,2)}function openModal(){document.getElementById("json-out").value=buildJSON(),document.getElementById("modal-overlay").classList.add("open")}function closeModal(){document.getElementById("modal-overlay").classList.remove("open")}function copyJSON(){document.getElementById("json-out").select(),document.execCommand("copy"),setStatus("Copiado")}function downloadJSON(){const e=new Blob([buildJSON()],{type:"application/json"}),n=document.createElement("a");n.href=URL.createObjectURL(e),n.download="llaves.json",n.click(),URL.revokeObjectURL(n.href),setStatus("Descargando...")}function setStatus(e){const n=document.getElementById("status");n.textContent=e,setTimeout(()=>{n.textContent===e&&(n.textContent="")},3e3)}document.getElementById("load-file").addEventListener("change",e=>{const n=e.target.files[0];if(!n)return;const t=new FileReader;t.onload=e=>{try{data=JSON.parse(e.target.result),activeIdx=data.length>0?0:-1,renderList(),renderEditor(),setStatus("Cargado: "+n.name+" ("+data.length+" llaves)")}catch(e){alert("Error JSON: "+e.message)}},t.readAsText(n),e.target.value=""})</script><script>const REPO_RAW="https://raw.githubusercontent.com/MiBaLToALeX/shellord-bot/main/";async function cargarDesdeRepo(e,t){try{const o=await fetch(REPO_RAW+e,{cache:"no-store"});if(!o.ok)throw new Error(404===o.status?"no existe en el repositorio":"HTTP "+o.status);const s=await o.text(),a=new DataTransfer;a.items.add(new File([s],e.split("/").pop(),{type:"application/json"}));const n=document.getElementById(t||"load-file");n.files=a.files,n.dispatchEvent(new Event("change",{bubbles:!0}))}catch(t){alert("No se pudo cargar "+e+" del repositorio: "+t.message)}}</script></body></html>
