<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habilidades Editor</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;font-size:13px}header{background:#16213e;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #0f3460;position:sticky;top:0;z-index:100;flex-wrap:wrap}header h1{font-size:16px;color:#e94560;white-space:nowrap}.btn{padding:6px 13px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}.btn:hover{opacity:.8}.btn-primary{background:#0f3460;color:#fff}.btn-success{background:#27ae60;color:#fff}.btn-danger{background:#c0392b;color:#fff}.btn-warn{background:#e67e22;color:#fff}.btn-repo{background:#1a5276;color:#fff}.btn-sm{padding:3px 8px;font-size:11px}input[type=file]{display:none}.lbl-btn{padding:6px 13px;border-radius:5px;background:#533483;color:#fff;font-size:12px;font-weight:600;cursor:pointer}.lbl-btn.sec{background:#3b2a5c}.lbl-btn:hover{opacity:.8}#app{display:flex;height:calc(100vh - 49px);overflow:hidden}#sidebar{width:240px;min-width:180px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;flex-shrink:0}#lista{flex:1;overflow-y:auto}.item{padding:9px 12px;cursor:pointer;border-left:3px solid transparent;display:flex;flex-direction:column;gap:2px}.item:hover{background:#0f3460}.item.active{border-left-color:#e94560;background:#0f3460}.item-id{font-size:11px;color:#aaa;font-family:monospace}.item-nombre{font-size:13px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-foot{padding:10px 12px;border-top:1px solid #0f3460;display:flex;flex-direction:column;gap:6px}#search{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:6px 8px;border-radius:4px;width:100%;font-size:12px}#editor{flex:1;overflow-y:auto;padding:20px}.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:15px;text-align:center;line-height:1.6}.card{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:18px;max-width:1000px}.card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.card-header h2{font-size:18px;color:#e94560;font-family:monospace}.section-hdr{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid #0f3460;display:flex;justify-content:space-between;align-items:center}.field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}.field{display:flex;flex-direction:column;gap:3px}.field label{font-size:11px;color:#888}.field label span{color:#7ec8e3}.field input[type=number],.field input[type=text],.field select,.field textarea{background:#0d1b2a;border:1px solid #1a5276;color:#fff;padding:5px 8px;border-radius:4px;font-size:13px}.field input[type=text]{width:200px}.field input[type=number]{width:80px}.field textarea{width:460px;max-width:100%;height:50px;resize:vertical;font-family:inherit}.paso{background:#0d1b2a;border:1px solid #1a5276;border-radius:6px;padding:8px 10px;margin-bottom:8px}.paso.es-efecto{border-color:#533483}.paso-cab{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}.paso-num{font-family:monospace;color:#e94560;font-size:14px;align-self:center;min-width:22px}.desc{font-size:11px;color:#9ab;margin:2px 0 6px;line-height:1.45;border-left:3px solid #533483;padding-left:8px}.resumen{background:#0d1b2a;border:1px solid #533483;border-radius:6px;padding:8px 10px;color:#c4a8ff;font-size:12px;margin-top:10px;line-height:1.6}#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}#modal-overlay.open{display:flex}#modal{background:#16213e;border:1px solid #0f3460;border-radius:10px;width:700px;max-width:95vw;max-height:82vh;display:flex;flex-direction:column}#modal-head{padding:12px 16px;border-bottom:1px solid #0f3460;display:flex;justify-content:space-between;align-items:center}#modal-head h3{color:#e94560}#modal-body{flex:1;overflow:auto;padding:14px}#modal-body textarea{width:100%;height:420px;background:#0d1b2a;color:#7ec8e3;font-family:monospace;font-size:12px;border:1px solid #0f3460;border-radius:5px;padding:10px;resize:vertical}#modal-foot{padding:10px 16px;border-top:1px solid #0f3460;display:flex;gap:8px;justify-content:flex-end}@media (max-width:700px){#app{flex-direction:column;height:auto}#sidebar{width:100%;max-height:40vh}}</style></head><body><header><a href="../" title="Volver a las herramientas" style="flex:none;padding:5px 10px;border-radius:5px;background:#12152a;border:1px solid #533483;color:#e8c84a;font:600 12px/1.4 ui-monospace,Consolas,monospace;text-decoration:none;white-space:nowrap">&#8592; Herramientas</a><h1>Habilidades Editor</h1><label class="lbl-btn" for="load-file">Abrir JSON</label> <input type="file" id="load-file" accept=".json"> <button class="btn btn-repo" onclick='cargarDesdeRepo("habilidades.json")' title="Cargar desde github.com/MiBaLToALeX/shellord-bot">🌐 Cargar del repo</button> <label class="lbl-btn sec" for="load-efectos" title="Los efectos que se pueden elegir en los pasos">Abrir efectos.json</label> <input type="file" id="load-efectos" accept=".json"> <button class="btn btn-success" onclick="openModal()">Exportar</button> <button class="btn btn-warn" onclick="downloadJSON()">Descargar</button> <span id="status" style="font-size:11px;color:#888;margin-left:6px"></span></header><div id="app"><div id="sidebar"><div style="padding:8px 10px;border-bottom:1px solid #0f3460"><input id="search" placeholder="Buscar..." oninput="renderSidebar()"></div><div id="lista"></div><div class="sidebar-foot"><button class="btn btn-success" onclick="addHabilidad()">+ Nueva habilidad</button><div id="info-efectos" style="font-size:11px;color:#777"></div></div></div><div id="editor"><div class="empty-state">Abre tu habilidades.json o cárgalo del repositorio,<br>o crea una habilidad nueva.</div></div></div><div id="modal-overlay"><div id="modal"><div id="modal-head"><h3>JSON exportado</h3><button class="btn btn-sm btn-danger" onclick="closeModal()">X</button></div><div id="modal-body"><textarea id="json-out" readonly="readonly"></textarea></div><div id="modal-foot"><button class="btn btn-primary" onclick="copyJSON()">Copiar</button> <button class="btn btn-success" onclick="downloadJSON()">Descargar</button> <button class="btn btn-danger btn-sm" onclick="closeModal()">Cerrar</button></div></div></div><datalist id="marcas-conocidas"><option value="colisionado">choca con un muro al ser desplazado</option><option value="desplazado">cambia de casilla (empuje, teletransporte...)</option><option value="curado">se cura</option><option value="contagio">un jugador pegado a él recibe una cura</option><option value="castigado">sufre veneno, quemadura o electrocución</option><option value="c2c">golpeado a distancia ≤ 1</option><option value="distanciado">golpeado a distancia &gt; 1</option><option value="mortal">teletransporte simétrico con destino ocupado</option><option value="unico">es el único enemigo que queda en el mapa</option><option value="solo">solo queda un jugador en el mapa</option><option value="rodeado">tiene a alguien (aliado o rival) en una casilla de al lado</option><option value="rodeado2">tiene al lado al menos un aliado y un rival</option><option value="rodeado4">rodeado del todo: no puede ir a ninguna dirección</option><option value="jbuceando">algún jugador de la sala está buceando (Bucear)</option><option value="jvolador">algún jugador de la sala está volando (Volar)</option><option value="invoquocidio">ha muerto una invocación suya</option><option value="glifeado">lleva 30 s dentro de un glifo de jugador</option><option value="visionario">ha ganado alcance</option><option value="desalcance">ha perdido alcance</option><option value="tozudo">un jugador de la sala ha revivido</option><option value="entrampado">ha pisado una trampa</option><option value="inmovilizado">no puede moverse (atado o levantado)</option></datalist><script>const REPO_RAW="https://raw.githubusercontent.com/MiBaLToALeX/shellord-bot/main/",ACCIONES={infeccion:{emoji:"☣️",cat:"Daño/turno",desc:"Quita VALOR energía al jugador cada turno que ataca.",campos:{valor:"dmg/turno",ataques:"turnos"}},sobrecarga:{emoji:"⚡",cat:"Daño/turno",desc:"Igual que infección, daño por turno. Emoji ⚡️.",campos:{valor:"dmg/turno",ataques:"turnos"}},radiacion:{emoji:"☢️",cat:"Daño/turno",desc:"Igual que infección, daño por turno. Emoji ☢️.",campos:{valor:"dmg/turno",ataques:"turnos"}},desgarre:{emoji:"🩸",cat:"Daño/turno",desc:"Daño por turno basado en TIEMPO en vez de ataques.",campos:{valor:"dmg/turno",tiempo:"segundos"}},desintegracion:{emoji:"💥",cat:"Daño/turno",desc:"Quita el 10% de energía máxima del jugador cada vez que ataca.",campos:{ataques:"turnos"}},quemado:{emoji:"🔥",cat:"Daño/turno",desc:"Quita VALOR% de la energía ACTUAL por turno. Decrece con la vida.",campos:{valor:"% energia actual",ataques:"turnos"}},aturdido:{emoji:"💫",cat:"Bloqueo",desc:"Fallo garantizado durante ATAQUES turnos. Se consume 1 por intento.",campos:{ataques:"turnos"}},neutralizado:{emoji:"🛑",cat:"Bloqueo",desc:"No puede atacar hasta que el enemigo ataque (consume el estado).",campos:{ataques:"usos"}},ralentizado:{emoji:"⏳",cat:"Bloqueo",desc:"No puede atacar durante TIEMPO segundos.",campos:{tiempo:"segundos"}},paralizado:{emoji:"🐢",cat:"Bloqueo",desc:"Igual que ralentizado. Mensaje diferente.",campos:{tiempo:"segundos"}},cortocircuito:{emoji:"🔌",cat:"Bloqueo",desc:"VALOR% de probabilidad de fallo de ataque por turno.",campos:{valor:"prob%",ataques:"turnos"}},interferencia:{emoji:"⏱️",cat:"Bloqueo",desc:"VALOR% de probabilidad de fallo basado en TIEMPO.",campos:{valor:"prob%",tiempo:"segundos"}},distorsion:{emoji:"🌀",cat:"Bloqueo",desc:"VALOR% prob de que el ataque falle por turno (con tick_estado).",campos:{valor:"prob%",ataques:"turnos"}},confusion:{emoji:"🌀",cat:"Auto-daño",desc:"VALOR% prob de auto-golpe (daño con ATK propio) por ataque.",campos:{valor:"prob%",ataques:"turnos"}},zombificacion:{emoji:"🧟",cat:"Auto-daño",desc:"Igual que confusión (auto-golpe con % por ataque).",campos:{valor:"prob%",ataques:"turnos"}},corrupto:{emoji:"💀",cat:"Auto-daño",desc:"Igual que confusión (auto-golpe con % por ataque).",campos:{valor:"prob%",ataques:"turnos"}},hackeado:{emoji:"🤖",cat:"Auto-daño",desc:"Igual que confusión (auto-golpe con % por ataque).",campos:{valor:"prob%",ataques:"turnos"}},reduccion_def:{emoji:"🔻",cat:"Stats",desc:"Reduce la DEF del jugador en VALOR puntos porcentuales.",campos:{valor:"DEF%",ataques:"turnos"}},corrosion:{emoji:"🧪",cat:"Stats",desc:"Reduce ATK del jugador acumulativamente en VALOR% por ataque.",campos:{valor:"ATK%",ataques:"turnos"}},desconexion:{emoji:"🔌",cat:"Stats",desc:"DEF=0 al recibir daño y ATK reducido a 1 al atacar.",campos:{ataques:"turnos"}},encriptado:{emoji:"🔒",cat:"Stats",desc:"El jugador no puede usar objetos del inventario.",campos:{ataques:"turnos"}},anulacion:{emoji:"🚫",cat:"Stats",desc:"Elimina TODOS los estados activos del jugador de inmediato.",campos:{}},reenvio:{emoji:"🔄",cat:"Buff/Jugador",desc:"Refleja VALOR% del daño recibido al enemigo durante ATAQUES turnos. También activa en el enemigo.",campos:{valor:"reflejo%",ataques:"turnos"}},holoescudo:{emoji:"🛡️",cat:"Buff/Jugador",desc:"[Efecto común: con OBJETIVO se aplica al jugador golpeado] Reduce daño entrante en VALOR% durante ATAQUES turnos. También activa en el enemigo.",campos:{valor:"reduccion%",ataques:"turnos"}},overclock:{emoji:"⚡",cat:"Buff/Jugador",desc:"Aumenta ATK del jugador en VALOR, pero reduce DEF en VALOR2.",campos:{valor:"+ATK",valor2:"-DEF",ataques:"turnos"}},regeneracion:{emoji:"✨",cat:"Buff/Jugador",desc:"El jugador recupera VALOR energía cada turno que ataca.",campos:{valor:"hp/turno",ataques:"turnos"}},suertudo:{emoji:"🍀",cat:"Buff/Jugador",desc:"Aumenta % de crítico del jugador en VALOR puntos.",campos:{valor:"+crit%",ataques:"turnos"}},optimizacion:{emoji:"⚙️",cat:"Buff/Jugador",desc:"Aumenta daño del jugador en VALOR% durante ATAQUES turnos.",campos:{valor:"dmg%",ataques:"turnos"}},turbo:{emoji:"⚡",cat:"Buff/Jugador",desc:"Aumenta daño en VALOR% (sobre ATK base). Soporta tiempo o ataques.",campos:{valor:"dmg%",ataques:"turnos (o tiempo)"}},invisibilidad:{emoji:"👻",cat:"Buff/Jugador",desc:"90% esquiva ataques enemigos. Se cancela al atacar.",campos:{valor:"esquiva%",ataques:"turnos"}},anticura:{emoji:"🚫",cat:"Buff/Jugador",desc:"El jugador no puede curarse con pociones durante ATAQUES usos.",campos:{ataques:"usos"}},energico:{emoji:"💪",cat:"Buff/Jugador",desc:"Otorga VALOR% de energía máxima extra (puede superar el máximo) durante ATAQUES turnos.",campos:{valor:"bonus%",ataques:"turnos"}},atraccion:{emoji:"🧲",cat:"Control",desc:"El jugador es arrastrado y continúa siendo objetivo aunque no esté adyacente.",campos:{ataques:"turnos"}},empuje:{emoji:"💨",cat:"Control",desc:"Aleja al jugador VALOR casillas del lanzador (diagonal incluida). Solo si está a distancia ≤1 (misma casilla o pegado). Daño si hay muro.",campos:{valor:"casillas"}},empuje_2:{emoji:"💨",cat:"Control",desc:"Igual que empuje, pero solo en cruz (sin diagonal): si el jugador está en diagonal, no hace nada.",campos:{valor:"casillas"}},empuje_3:{emoji:"💨",cat:"Control",desc:"Igual que empuje, pero solo actúa si el jugador está exactamente a distancia 1 (no en la misma casilla).",campos:{valor:"casillas"}},empuje_4:{emoji:"💨",cat:"Control",desc:"Igual que empuje, pero solo actúa si el jugador está en diagonal pura a distancia 1 (en cruz no hace nada).",campos:{valor:"casillas"}},robo:{emoji:"💰",cat:"Control",desc:"Roba VALOR créditos al jugador, o un objeto aleatorio.",campos:{valor:"creditos"}},muerte:{emoji:"☠️",cat:"Control",desc:"Cuenta atrás: si el enemigo sigue vivo al agotar ATAQUES, el jugador cae a 0 energía.",campos:{ataques:"turnos"}},magnetizado:{emoji:"🧲",cat:"Control",desc:"Mueve a TODOS los jugadores del portal a la posición del enemigo.",campos:{}},reductor:{emoji:"📉",cat:"Stats",desc:"Reduce el ATK del objetivo entre VALOR y VALOR2 durante ATAQUES turnos. Válido para jugadores y enemigos.",campos:{valor:"ATK mín reducción",valor2:"ATK máx reducción",ataques:"turnos"}},absorcion:{emoji:"🩸",cat:"Control",desc:"Roba entre VALOR y VALOR2 puntos de vida en área de ATAQUES casillas (ataques = radio aquí, efecto único). Válido para jugadores y enemigos.",campos:{valor:"hp mín",valor2:"hp máx",ataques:"radio casillas"}},vampirismo:{emoji:"🧛",cat:"Control",desc:"Roba VALOR% del daño causado por el jugador y lo distribuye entre los enemigos en radio VALOR2 casillas, durante ATAQUES turnos.",campos:{valor:"% daño robado",valor2:"radio casillas",ataques:"turnos"}},rollback:{emoji:"⏪",cat:"Efecto Enemigo",desc:"Durante TIEMPO segundos: cualquier ataque restaura energía a todos los jugadores y enemigos.",campos:{tiempo:"segundos"}},invocacion:{emoji:"🌑",cat:"Efecto Enemigo",desc:"Invoca VALOR2 aliados de tipo VALOR al golpear al jugador.",campos:{valor:"tipo enemigo",valor2:"cantidad"}},sacrificio:{emoji:"💀",cat:"Efecto Enemigo",desc:"El enemigo pierde VALOR% de energía para ganar VALOR2% ATK y escudo. Requiere sacrificio_energia_pct y sacrificio_bonus_pct.",campos:{valor:"%energia perdida",valor2:"%bonus ATK+escudo"}},deshacer:{emoji:"🗑️",cat:"Efecto Enemigo",desc:"Cuando el enemigo es golpeado ATAQUES veces con este efecto activo, elimina todos los estados del jugador. Solo enemigos.",campos:{ataques:"golpes para activar"}},critico:{emoji:"🎯",cat:"Efecto Enemigo",desc:"[Efecto común: con OBJETIVO se aplica al jugador golpeado] Añade VALOR% de probabilidad de golpe crítico al enemigo durante ATAQUES turnos.",campos:{valor:"crit%",ataques:"turnos"}},potencia:{emoji:"💪",cat:"Efecto Enemigo",desc:"[Efecto común: con OBJETIVO se aplica al jugador golpead
