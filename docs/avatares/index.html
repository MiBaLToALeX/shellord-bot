x"></span></header><div id="app"><div id="sidebar"><div style="padding:8px 10px;border-bottom:1px solid #0f3460"><input id="search" placeholder="Buscar..." oninput="renderSidebar()"></div><div id="av-list"></div><div class="sidebar-foot"><button class="btn btn-success" onclick="addAvatar()">+ Nuevo avatar</button></div></div><div id="editor"><div class="empty-state">Abre un avatares.json para empezar</div></div></div><div id="modal-overlay"><div id="modal"><div id="modal-head"><h3>JSON exportado</h3><button class="btn btn-sm btn-danger" onclick="closeModal()">X</button></div><div id="modal-body"><textarea id="json-out" readonly="readonly"></textarea></div><div id="modal-foot"><button class="btn btn-primary" onclick="copyJSON()">Copiar</button> <button class="btn btn-success" onclick="downloadJSON()">Descargar</button> <button class="btn btn-danger btn-sm" onclick="closeModal()">Cerrar</button></div></div></div><script>let data=[],activeId=null;function renderSidebar(){const e=document.getElementById("search").value.toLowerCase(),t=document.getElementById("av-list");t.innerHTML="",data.filter(t=>!e||t.id.toLowerCase().includes(e)||(t.nombre||"").toLowerCase().includes(e)).forEach(e=>{const a=document.createElement("div");a.className="av-item"+(e.id===activeId?" active":""),a.innerHTML='<span class="av-name">'+esc(e.nombre||e.id)+'</span><span class="av-id">'+esc(e.id)+"</span>",a.onclick=()=>{activeId=e.id,renderSidebar(),renderEditor()},t.appendChild(a)})}function renderEditor(){const e=document.getElementById("editor"),t=data.find(e=>e.id===activeId);if(!t)return void(e.innerHTML='<div class="empty-state">Selecciona un avatar</div>');const a=data.indexOf(t);let n='<div class="av-card">';n+='<div class="card-header"><h2>'+esc(t.id)+'</h2><button class="btn btn-danger btn-sm" onclick="deleteAvatar('+a+')">Eliminar</button></div>',n+=sec("Identidad"),n+='<div class="field-row">'+fld("id",'<input type="text" value="'+esc(t.id)+'" onchange="setAv('+a+",'id',this.value);activeId=this.value;renderSidebar()\">")+fld("nombre",'<input type="text" class="wide" value="'+esc(t.nombre||"")+'" onchange="setAv('+a+",'nombre',this.value);renderSidebar()\">")+fld("descripcion",'<textarea onchange="setAvNull('+a+",'descripcion',this.value)\">"+esc(t.descripcion||"")+"</textarea>")+"</div>",n+='<div class="field-row">'+fld("emoji",'<input type="text" class="w80" value="'+esc(t.emoji||"")+'" onchange="setAvNull('+a+",'emoji',this.value)\">")+fld("vol (pack sticker)",'<input type="number" class="w80" min="1" value="'+nv(t.vol)+'" placeholder="-" onchange="setAvNum('+a+",'vol',this.value)\">")+fld("indice (sticker)",'<input type="number" class="w80" min="0" value="'+nv(t.indice)+'" placeholder="-" onchange="setAvNum('+a+",'indice',this.value)\">")+fld("skill (id)",'<input type="text" class="w120" value="'+esc(t.skill||"")+'" placeholder="-" onchange="setAvNull('+a+",'skill',this.value)\">")+fld("skills (coma-separadas)",'<input type="text" style="width:220px" value="'+esc((t.skills||[]).join(", "))+'" placeholder="pesadez, rapidez, maldicion" onchange="setAvSkills('+a+',this.value)">')+fld("elemento",function(){const e=t.elemento||"neutral",n={neutral:"⚪",agua:"💧",fuego:"🔥",tierra:"🌿",aire:"💨",oscuridad:"🌑",luz:"✨"};return'<select style="width:130px" onchange="setAvNull('+a+",'elemento',this.value==='neutral'?null:this.value)\">"+["neutral","agua","fuego","tierra","aire","oscuridad","luz"].map(t=>'<option value="'+t+'"'+(e===t?" selected":"")+">"+n[t]+" "+t+"</option>").join("")+"</select>"}())+"</div>",n+=sec("Estadisticas de combate"),n+='<div class="stats-grid">'+statNum("dmg_bonus_pct (%)",t.dmg_bonus_pct,a,"dmg_bonus_pct")+statNum("dmg_fijo",t.dmg_fijo,a,"dmg_fijo")+statNum("def_bonus_pct (%)",t.def_bonus_pct,a,"def_bonus_pct")+statNum("def_fijo",t.def_fijo,a,"def_fijo")+statNum("vel_bonus_pct (%)",t.vel_bonus_pct,a,"vel_bonus_pct")+statNum("per_bonus_pct (%)",t.per_bonus_pct,a,"per_bonus_pct")+statNum("int_bonus_pct (%)",t.int_bonus_pct,a,"in tion nv(e){return null!=e?e:""}function statNum(e,t,a,n){return'<div class="stat-pill"><label>'+e+'</label><input type="number" min="0" value="'+nv(t)+'" placeholder="-" onchange="setAvNum('+a+",'"+n+"',this.value)\"></div>"}function statBool(e,t,a,n){return'<div class="stat-pill bool-pill"><label>'+e+'</label><input type="checkbox" '+(t?"checked":"")+' onchange="setAv('+a+",'"+n+"',this.checked)\"></div>"}function setAv(e,t,a){data[e][t]=a}function setAvNull(e,t,a){""===a||null==a?delete data[e][t]:data[e][t]=a}function setAvSkills(e,t){const a=t.split(",").map(e=>e.trim()).filter(e=>e.length>0);0===a.length?delete data[e].skills:data[e].skills=a}function setAvNum(e,t,a){""===a||null===a?delete data[e][t]:data[e][t]=Number(a)}function addAvatar(){const e=prompt("ID del nuevo avatar (ej: avatar_nuevo):");e&&e.trim()&&(data.find(t=>t.id===e.trim())?alert("Ya existe un avatar con ese ID"):(data.push({id:e.trim(),nombre:"Nuevo Avatar",formula:[]}),activeId=e.trim(),renderSidebar(),renderEditor()))}function deleteAvatar(e){if(!confirm('Eliminar avatar "'+data[e].id+'"?'))return;const t=data[e].id;data.splice(e,1),activeId===t&&(activeId=data.length>0?data[0].id:null),renderSidebar(),renderEditor()}function addFormula(e){data[e].formula||(data[e].formula=[]),data[e].formula.push({id_objeto:"",cantidad:1}),renderEditor()}function delFormula(e,t){data[e].formula.splice(t,1),renderEditor()}function setFormula(e,t,a,n){data[e].formula[t][a]=n}function setFormulaNum(e,t,a,n){data[e].formula[t][a]=Number(n)}function buildJSON(){return JSON.stringify(data,(e,t)=>void 0===t?void 0:t,2)}function openModal(){document.getElementById("json-out").value=buildJSON(),document.getElementById("modal-overlay").classList.add("open")}function closeModal(){document.getElementById("modal-overlay").classList.remove("open")}function copyJSON(){document.getElementById("json-out").select(),document.execCommand("copy"),setStatus("Copiado")}function downloadJSON(){const e=new Blob([buildJSON()],{type:"application/json"}),t=document.createElement("a");t.href=URL.createObjectURL(e),t.download="avatares.json",t.click(),URL.revokeObjectURL(t.href),setStatus("Descargando...")}function setStatus(e){const t=document.getElementById("status");t.textContent=e,setTimeout(()=>{t.textContent===e&&(t.textContent="")},3e3)}function esc(e){return String(e).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}document.getElementById("load-file").addEventListener("change",e=>{const t=e.target.files[0];if(!t)return;const a=new FileReader;a.onload=e=>{try{data=JSON.parse(e.target.result),activeId=data.length>0?data[0].id:null,renderSidebar(),renderEditor(),setStatus("Cargado: "+t.name+" ("+data.length+" avatares)")}catch(e){alert("Error JSON: "+e.message)}},a.readAsText(t),e.target.value=""})</script><script>const REPO_RAW="https://raw.githubusercontent.com/MiBaLToALeX/shellord-bot/main/";async function cargarDesdeRepo(e,t){try{const o=await fetch(REPO_RAW+e,{cache:"no-store"});if(!o.ok)throw new Error(404===o.status?"no existe en el repositorio":"HTTP "+o.status);const s=await o.text(),a=new DataTransfer;a.items.add(new File([s],e.split("/").pop(),{type:"application/json"}));const n=document.getElementById(t||"load-file");n.files=a.files,n.dispatchEvent(new Event("change",{bubbles:!0}))}catch(t){alert("No se pudo cargar "+e+" del repositorio: "+t.message)}}</script></body></html>
